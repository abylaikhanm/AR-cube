<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
  <title>View in AR</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f0f0f0;
    }

    .ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #FF2400;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <model-viewer 
    src="topo_mesh.glb"
    ios-src="topo_mesh.usdz"
    ar
    ar-modes="quick-look"
    camera-controls
    auto-rotate>

    <button slot="ar-button" class="ar-button">View in AR</button>
    
  </model-viewer>
</body>
</html>
