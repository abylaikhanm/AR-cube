<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <title>View in AR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    /* BIG, VISIBLE BUTTON */
    button[slot="ar-button"] {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);

      background: linear-gradient(135deg, #FF2400, #ff5e3a);
      color: white;
      border: none;
      border-radius: 14px;

      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;

      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      cursor: pointer;

      transition: all 0.2s ease;
    }

    button[slot="ar-button"]:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    button[slot="ar-button"]:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>

<body>

  <model-viewer 
    src="topo_mesh.glb"
    ios-src="topo_mesh.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    ar-scale="fixed">

    <button slot="ar-button">🚀 View in AR</button>

  </model-viewer>

</body>
</html>
